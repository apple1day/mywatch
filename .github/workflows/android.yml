name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform and build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Test profile and data handling
        run: bash tools/test-profile.sh
      - name: Compile, sign and verify
        run: bash tools/build-apk.sh
      - name: Upload CI test APK
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-Watch-Link-CI-test
          path: |
            dist/*.apk
            dist/*.sha256
          retention-days: 14
